[workspace]
resolver = "2"
members = [
    "crates/strata_mcp",
    "examples/mcp_demo",
]

[workspace.package]
version = "0.1.0"
authors = ["Strata Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/strataui/mcp"
homepage = "https://github.com/strataui/mcp"
documentation = "https://docs.rs/strata-mcp"
keywords = ["strata", "mcp", "gui", "automation", "testing"]
categories = ["gui", "development-tools::testing"]

[workspace.dependencies]
strata-mcp = { path = "crates/strata_mcp", version = "0.1.0" }
strata-ui = "0.1.4"
strata-dom = "0.1.2"
strata-ui-platform = "0.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 1
